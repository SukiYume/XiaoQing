name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  XIAOQING_CI: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XIAOQING_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy core plugins
      - name: Tests
        run: python -m pytest -q -n auto --cov=core --cov=plugins --cov-report=term-missing

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Windows process and monitor tests
        run: >-
          python -m pytest -q -n 2
          tests/plugins/codex/test_codex_process_tree.py
          tests/scripts/test_run_bot_monitor_script.py
          tests/scripts/test_rotating_log_runner.py
          tests/scripts/test_bot_monitor_powershell.py
