name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  XIAOQING_CI: "1"

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distribution in isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-build"
          "$RUNNER_TEMP/wheel-build/bin/python" -m pip install build==1.5.1
          "$RUNNER_TEMP/wheel-build/bin/python" -m build --outdir "$RUNNER_TEMP/wheel-dist"
      - name: Install wheel and check outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-install"
          wheels=("$RUNNER_TEMP"/wheel-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/wheel-install/bin/python" -m pip install "${wheels[0]}[plugins]"
          cp scripts/check_installed_wheel.py "$RUNNER_TEMP/check_installed_wheel.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-install/bin/python" -I check_installed_wheel.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      XIAOQING_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Project code style
        run: python scripts/format_code.py --check
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy core plugins
      - name: Tests
        run: python -m pytest -q -n auto --cov=core --cov=plugins --cov-report=term-missing

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Windows process tests
        run: >-
          python -m pytest -q -n 2
          tests/plugins/codex/test_codex_process_tree.py
