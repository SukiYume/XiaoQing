name: Tests

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  lint-changed-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with history for the pull-request diff
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install locked lint dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements/python-3.13-ci.lock

    - name: Reject Ruff diagnostics on changed Python lines
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          BASE_SHA="$(git rev-parse HEAD^)"
        fi
        python scripts/check_ruff_changed.py --base "$BASE_SHA"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      env:
        LOCK_FILE: requirements/python-${{ matrix.python-version }}-ci.lock
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r "$LOCK_FILE"

    - name: Verify dependency lock freshness
      if: matrix.python-version == '3.13'
      run: |
        python scripts/compile_locks.py --check

    - name: Verify full test collection
      run: |
        python scripts/check_test_collection.py --minimum 2200

    - name: Scan Git-tracked release inputs for secrets
      run: |
        python scripts/scan_workspace_secrets.py --tracked .

    - name: Run full test suite
      run: |
        python -m pytest tests/ --cov=core --cov=plugins --cov-branch --cov-report=xml --cov-report=json:coverage.json

    - name: Enforce risk-based package line and branch coverage floors
      run: |
        python scripts/check_coverage_floors.py --coverage-json coverage.json

    - name: Enforce privileged-plugin branch coverage floor
      if: matrix.python-version == '3.13'
      run: |
        python -m pytest tests/plugins/test_codex.py tests/plugins/test_shell_plugin.py tests/plugins/test_jupyter.py tests/plugins/test_qingssh.py tests/plugins/test_minecraft.py --cov=plugins/codex --cov=plugins/shell --cov=plugins/jupyter --cov=plugins/qingssh --cov=plugins/minecraft --cov-branch --cov-report=term --cov-fail-under=45

    - name: Python 3.13 isolated wheel and sdist release smoke
      if: matrix.python-version == '3.13'
      run: |
        python scripts/verify_python_release.py

    - name: Audit locked dependencies
      if: matrix.python-version == '3.13'
      env:
        LOCK_FILE: requirements/python-${{ matrix.python-version }}-ci.lock
      run: |
        pip-audit --require-hashes -r "$LOCK_FILE"
        pip-licenses --format=markdown

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests

  docker-release-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Build and verify the isolated Docker release
      run: |
        build_root="$(mktemp -d)"
        trap 'rm -rf -- "$build_root"' EXIT
        mkdir "$build_root/dist"
        python -m pip wheel . --no-deps --wheel-dir "$build_root/dist"
        python scripts/build_docker_context.py \
          --dist-dir "$build_root/dist" \
          --context-dir "$build_root/context"
        python scripts/verify_docker_release.py \
          --context-dir "$build_root/context" \
          --image-tag "xiaoqing-ci:${GITHUB_SHA}" \
          --require-docker
