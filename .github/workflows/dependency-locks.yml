name: Refresh dependency locks

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-lock-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    steps:
      - name: Checkout the source commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the repository default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$DEFAULT_BRANCH" || "$DEFAULT_BRANCH" == -* || \
                "$DEFAULT_BRANCH" == *$'\n'* || "$DEFAULT_BRANCH" == *$'\r'* ]]; then
            echo "Repository default branch is invalid" >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Dependency locks may only be refreshed from the repository default branch" >&2
            exit 1
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/python-3.13-ci.lock

      - name: Install the hash-locked lock compiler environment
        run: |
          python -m pip install --require-hashes -r requirements/python-3.13-ci.lock

      - name: Regenerate and verify all dependency locks
        run: |
          python scripts/compile_locks.py --upgrade
          python scripts/compile_locks.py --check

      - name: Build the fixed lock bundle and checksum manifest
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lock_files=(
            python-3.10-ci.lock
            python-3.10-runtime.lock
            python-3.11-ci.lock
            python-3.11-runtime.lock
            python-3.12-ci.lock
            python-3.12-runtime.lock
            python-3.13-ci.lock
            python-3.13-runtime.lock
          )
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match GITHUB_SHA" >&2
            exit 1
          fi
          bundle="$(mktemp -d "$RUNNER_TEMP/dependency-locks.XXXXXX")"
          for filename in "${lock_files[@]}"; do
            source="requirements/$filename"
            if [[ ! -f "$source" || -L "$source" ]]; then
              echo "Lock is missing, non-regular, or linked: $filename" >&2
              exit 1
            fi
            size="$(stat -c '%s' -- "$source")"
            if (( size < 1 || size > 16777216 )); then
              echo "Lock size is outside the release budget: $filename" >&2
              exit 1
            fi
            install -m 0600 -- "$source" "$bundle/$filename"
          done
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_COMMIT"
          (
            cd "$bundle"
            sha256sum -- "${lock_files[@]}" SOURCE_COMMIT > SHA256SUMS
          )
          bundle_total_size=0
          for member in "$bundle"/*; do
            member_size="$(stat -c '%s' -- "$member")"
            bundle_total_size=$((bundle_total_size + member_size))
          done
          if (( bundle_total_size > 134217728 )); then
            echo "Lock bundle exceeds the total release budget" >&2
            exit 1
          fi
          manifest_sha256="$(sha256sum -- "$bundle/SHA256SUMS")"
          manifest_sha256="${manifest_sha256%% *}"
          if [[ ! "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to calculate the checksum-manifest digest" >&2
            exit 1
          fi
          printf 'bundle_path=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable lock bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-locks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.bundle_path }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the source commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download only the generated artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: ${{ runner.temp }}/dependency-lock-bundle
          merge-multiple: true

      - name: Validate and copy the inert lock bundle
        id: validate
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.generate.outputs.manifest_sha256 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          lock_files=(
            python-3.10-ci.lock
            python-3.10-runtime.lock
            python-3.11-ci.lock
            python-3.11-runtime.lock
            python-3.12-ci.lock
            python-3.12-runtime.lock
            python-3.13-ci.lock
            python-3.13-runtime.lock
          )
          bundle="$RUNNER_TEMP/dependency-lock-bundle"
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Publish checkout does not match the workflow source commit" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Artifact ID is invalid" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Expected checksum-manifest digest is invalid" >&2
            exit 1
          fi
          if [[ ! -d "$bundle" || -L "$bundle" ]]; then
            echo "Downloaded artifact root is missing, non-directory, or linked" >&2
            exit 1
          fi
          members=("$bundle"/*)
          if (( ${#members[@]} != 10 )); then
            echo "Lock bundle must contain exactly 10 members" >&2
            exit 1
          fi
          bundle_total_size=0
          for member in "${members[@]}"; do
            if [[ ! -f "$member" || -L "$member" ]]; then
              echo "Artifact member is non-regular or linked: $(basename -- "$member")" >&2
              exit 1
            fi
            member_size="$(stat -c '%s' -- "$member")"
            bundle_total_size=$((bundle_total_size + member_size))
            filename="$(basename -- "$member")"
            case "$filename" in
              python-3.10-ci.lock|python-3.10-runtime.lock|\
              python-3.11-ci.lock|python-3.11-runtime.lock|\
              python-3.12-ci.lock|python-3.12-runtime.lock|\
              python-3.13-ci.lock|python-3.13-runtime.lock|\
              SOURCE_COMMIT|SHA256SUMS)
                ;;
              *)
                echo "Unexpected artifact member: $filename" >&2
                exit 1
                ;;
            esac
          done
          if (( bundle_total_size > 134217728 )); then
            echo "Downloaded lock bundle exceeds the total release budget" >&2
            exit 1
          fi
          for filename in "${lock_files[@]}"; do
            size="$(stat -c '%s' -- "$bundle/$filename")"
            if (( size < 1 || size > 16777216 )); then
              echo "Downloaded lock size is outside the release budget: $filename" >&2
              exit 1
            fi
          done
          if [[ "$(stat -c '%s' -- "$bundle/SOURCE_COMMIT")" != 41 ]]; then
            echo "SOURCE_COMMIT has an invalid size" >&2
            exit 1
          fi
          if [[ "$(stat -c '%s' -- "$bundle/SHA256SUMS")" -lt 1 || \
                "$(stat -c '%s' -- "$bundle/SHA256SUMS")" -gt 4096 ]]; then
            echo "SHA256SUMS has an invalid size" >&2
            exit 1
          fi
          mapfile -t source_lines < "$bundle/SOURCE_COMMIT"
          if (( ${#source_lines[@]} != 1 )) || \
             [[ ! "${source_lines[0]}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${source_lines[0]}" != "$SOURCE_SHA" ]]; then
            echo "SOURCE_COMMIT does not match the workflow source commit" >&2
            exit 1
          fi
          actual_manifest_sha256="$(sha256sum -- "$bundle/SHA256SUMS")"
          actual_manifest_sha256="${actual_manifest_sha256%% *}"
          if [[ "$actual_manifest_sha256" != "$EXPECTED_MANIFEST_SHA256" ]]; then
            echo "Checksum-manifest digest does not match the generate job output" >&2
            exit 1
          fi
          mapfile -t checksum_lines < "$bundle/SHA256SUMS"
          if (( ${#checksum_lines[@]} != 9 )); then
            echo "SHA256SUMS must contain exactly nine records" >&2
            exit 1
          fi
          checksum_pattern='^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$'
          declare -A checksum_seen=()
          for line in "${checksum_lines[@]}"; do
            if [[ ! "$line" =~ $checksum_pattern ]]; then
              echo "Malformed SHA256SUMS record" >&2
              exit 1
            fi
            filename="${BASH_REMATCH[2]}"
            case "$filename" in
              python-3.10-ci.lock|python-3.10-runtime.lock|\
              python-3.11-ci.lock|python-3.11-runtime.lock|\
              python-3.12-ci.lock|python-3.12-runtime.lock|\
              python-3.13-ci.lock|python-3.13-runtime.lock|SOURCE_COMMIT)
                ;;
              *)
                echo "Checksum manifest names an unexpected file: $filename" >&2
                exit 1
                ;;
            esac
            if [[ -n "${checksum_seen[$filename]+present}" ]]; then
              echo "Checksum manifest repeats a file: $filename" >&2
              exit 1
            fi
            checksum_seen["$filename"]=1
          done
          for filename in "${lock_files[@]}" SOURCE_COMMIT; do
            if [[ -z "${checksum_seen[$filename]+present}" ]]; then
              echo "Checksum manifest omits a required file: $filename" >&2
              exit 1
            fi
          done
          (
            cd "$bundle"
            sha256sum --check --strict SHA256SUMS
          )
          if [[ ! -d requirements || -L requirements ]]; then
            echo "requirements is missing, non-directory, or linked" >&2
            exit 1
          fi
          changed=false
          for filename in "${lock_files[@]}"; do
            destination="requirements/$filename"
            if [[ ! -f "$destination" || -L "$destination" ]]; then
              echo "Repository lock is missing, non-regular, or linked: $filename" >&2
              exit 1
            fi
            if ! cmp -s -- "$bundle/$filename" "$destination"; then
              changed=true
            fi
            install -m 0644 -- "$bundle/$filename" "$destination"
            cmp -s -- "$bundle/$filename" "$destination"
          done
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

      - name: Commit, push, and open the fixed dependency-lock pull request
        if: steps.validate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          lock_files=(
            requirements/python-3.10-ci.lock
            requirements/python-3.10-runtime.lock
            requirements/python-3.11-ci.lock
            requirements/python-3.11-runtime.lock
            requirements/python-3.12-ci.lock
            requirements/python-3.12-runtime.lock
            requirements/python-3.13-ci.lock
            requirements/python-3.13-runtime.lock
          )
          branch="automation/dependency-locks"
          remote_ref="refs/heads/$branch"
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Publish source ref does not match the repository default branch" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          remote_head="$(git ls-remote --heads origin "$remote_ref")"
          expected_remote=""
          if [[ -n "$remote_head" ]]; then
            if [[ ! "$remote_head" =~ ^([0-9a-f]{40})[[:space:]]+refs/heads/automation/dependency-locks$ ]]; then
              echo "Dependency-lock branch lookup returned an invalid result" >&2
              exit 1
            fi
            expected_remote="${BASH_REMATCH[1]}"
          fi
          git switch --create "$branch"
          git add -- "${lock_files[@]}"
          if git diff --cached --quiet; then
            echo "Dependency locks are already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: refresh dependency locks"
          lease="$remote_ref:"
          if [[ -n "$expected_remote" ]]; then
            lease="$remote_ref:$expected_remote"
          fi
          git push --force-with-lease="$lease" --set-upstream origin "$branch"
          existing_pr_lines="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --limit 100 \
              --json number,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | .number'
          )"
          existing_pr=""
          if [[ -n "$existing_pr_lines" ]]; then
            mapfile -t existing_pr_numbers <<< "$existing_pr_lines"
            if (( ${#existing_pr_numbers[@]} != 1 )); then
              echo "Multiple same-repository dependency-lock PRs are open" >&2
              exit 1
            fi
            existing_pr="${existing_pr_numbers[0]}"
          fi
          if [[ -n "$existing_pr" ]]; then
            if [[ ! "$existing_pr" =~ ^[1-9][0-9]*$ ]]; then
              echo "Existing dependency-lock PR lookup returned an invalid number" >&2
              exit 1
            fi
            echo "Updated existing dependency-lock PR #$existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "chore: refresh dependency locks" \
              --body "Automated weekly refresh of the eight hashed runtime and CI dependency locks."
          fi
