<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15182c">
  <base href="./">
  <script>
    if (/\/diary\/[^/]+$/.test(location.pathname)) document.querySelector("base").href = "../";
    if (!location.pathname.endsWith("/")) document.documentElement.className = "station-subpage";
  </script>
  <style>
@font-face{font-family:Fusion;src:url("assets/fusion-pixel.woff2") format("woff2");font-display:swap}
:root{
  color-scheme:dark;
  --night:#131628;--panel:#1c2036;--line:#43455e;--cream:#fff3d7;
  --text:#ece5dc;--muted:#beb8ce;--gold:#ffda88;--mint:#99dec4;
  --pixel:Fusion,"Microsoft YaHei",sans-serif;
  --body:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--text);font:16px/1.75 var(--body)}
a{color:var(--gold);text-underline-offset:4px}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #fff4ad;outline-offset:4px;z-index:2}
.wrap{width:min(1180px,calc(100% - 96px));margin-inline:auto}
.top{background:#171a30;border-bottom:2px solid #54506c}
.bar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:13px;color:var(--cream);font:24px/1.2 var(--pixel);text-decoration:none;white-space:nowrap}
.star{display:inline-block;width:26px;height:26px;background:var(--gold);clip-path:polygon(43% 0,57% 0,57% 24%,69% 24%,69% 36%,81% 36%,81% 43%,100% 43%,100% 57%,78% 57%,78% 66%,66% 66%,66% 79%,56% 79%,56% 100%,43% 100%,43% 79%,32% 79%,32% 67%,20% 67%,20% 57%,0 57%,0 43%,21% 43%,21% 34%,34% 34%,34% 23%,43% 23%)}
nav{display:flex;gap:6px;align-items:center}
nav a,.filters a{font:18px/1 var(--pixel);text-decoration:none;color:var(--muted);padding:9px 12px}
nav a:hover,.filters a:hover{color:var(--cream);background:#32354b}
nav a[aria-current],.filters a[aria-current]{background:var(--gold);color:#262238;box-shadow:inset 0 -3px #c79b5d,2px 2px #090a17}
.skip{position:absolute;left:12px;top:-80px;padding:8px 18px;background:var(--night);z-index:10}
.skip:focus{top:8px}
main{min-height:70vh}
.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;align-content:center;min-height:430px;height:clamp(470px,37vw,645px);border-bottom:3px solid #090b18;background:#302740}
.hero-art{position:absolute;inset:0;width:100%;height:100%;background:center 18% / cover no-repeat url("assets/club.webp");z-index:-3}
.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(16,16,38,.89),rgba(21,17,41,.62) 30%,transparent 67%)}
.hero-content{position:relative;padding-block:38px;animation:arrive .45s ease-out}
.eyebrow,.speaker,.screen-label,.paper-meta,.legend,.day-info,.live-meta,.back,.read,.leaf-nav,.home-log a,.section-title>a{font-family:var(--pixel)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.4;letter-spacing:2px;color:var(--gold)}
.eyebrow>i:not(.signal){width:18px;height:3px;background:currentColor;box-shadow:5px -5px currentColor}
h1,h2,h3{font-family:var(--pixel);font-weight:normal;line-height:1.25;color:var(--cream)}
h1{font-size:clamp(37px,5vw,64px);margin:12px 0}
h2{font-size:clamp(26px,3.5vw,37px);margin:20px 0}
h3{font-size:23px;margin:0 0 12px}
.hero h1{font-size:clamp(60px,6.4vw,100px);line-height:1.05;margin:17px 0 14px;letter-spacing:.025em;text-shadow:4px 4px #2b233d}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{color:#fff0df;line-height:1.8;margin:0;text-shadow:1px 1px 3px #1e1326}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:25px}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:7px 18px;font:18px/1.45 var(--pixel);text-decoration:none;border:2px solid #141522;box-shadow:3px 3px #101120}
.action.primary{background:var(--gold);color:#272236;box-shadow:inset 0 -3px #cea05b,3px 3px #101120}
.action.secondary{color:var(--cream);background:#25283f;border-color:#a6a0b2;box-shadow:inset 0 -3px #36394c,3px 3px #101120}
.action:hover,.advance:hover{transform:translateY(-2px)}
.transmission{border-block:1px solid #56526b;background:#25273b}
.transmission>.wrap{min-height:55px;display:flex;align-items:center;gap:20px}
.transmission b,.transmission a{font:18px var(--pixel);white-space:nowrap}
.transmission b{color:var(--mint);display:flex;align-items:center;gap:9px}
.transmission a{margin-left:auto;text-decoration:none}
.signal{display:inline-block;background:var(--mint);width:8px;height:8px;box-shadow:0 0 0 3px #354a4c}
#now{font:17px/1.5 var(--pixel);color:var(--cream)}
.home-log{padding-block:42px 70px}
.section-title,.leaf-nav,.live-meta{display:flex;align-items:center;justify-content:space-between;gap:18px}
.section-title h2,.section-title h1{margin:6px 0}
.section-title>a,.leaf-nav a,.back,.read{font-size:17px;text-decoration:none}
.section-title>a:hover,.transmission a:hover,.back:hover,.leaf-nav a:hover{text-decoration:underline}
.home-columns{border-top:1px solid var(--line);padding-top:22px;margin-top:15px;display:grid;grid-template-columns:1fr 1.25fr;gap:44px}
.home-columns h3{font-size:22px}
.inner{padding-block:50px 76px}
.narrow,.reader{max-width:870px}
.pagehead{margin-bottom:32px;border-bottom:1px solid var(--line);padding-bottom:20px}
.pagehead p,.section-title small,.live-meta,.empty,.back,.leaf-nav,.legend{color:var(--muted)}
.pagehead p{margin:8px 0}
.live .section-title{margin:0 0 22px}
.live-meta{padding:13px 4px;font-size:18px}
.live-meta b{color:var(--mint);font-weight:normal}
.stage{border:2px solid #85819b;box-shadow:4px 4px #090b18;background:var(--panel)}
.viewport{position:relative;isolation:isolate}
.screen,.opening-screen{aspect-ratio:16/8.1}
.opening-screen,.art-status{display:grid;place-items:center;color:var(--muted);font:17px var(--pixel)}
.opening-screen{border:2px solid #85819b;background:var(--panel)}
.art-status{position:absolute;inset:0}
.screen{position:relative;width:100%;padding:0;display:block;overflow:hidden;border:0;background:#25263b;text-align:left}
.screen:focus-visible{z-index:auto;outline-offset:-4px}
.scene-art,.room{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;pointer-events:none}
.actor{position:absolute;pointer-events:none;height:96%;aspect-ratio:1;right:5%;bottom:-1%;transform-origin:50% 100%}
.pose{display:block;width:100%;height:100%;overflow:hidden;transform-origin:50% 100%}
.pose img{display:block;width:200%;height:200%;max-width:none;transform:translate(var(--pose-x,0%),var(--pose-y,0%))}
.stage[data-pose="idle"] .pose{animation:breathe 3.7s ease-in-out infinite}
.stage[data-pose="startled"]{--pose-x:-50%}
.stage[data-pose="sharing"]{--pose-y:-50%}
.stage[data-pose="cross"]{--pose-x:-50%;--pose-y:-50%}
.stage[data-scene="rest"] .actor{right:0;height:93%}
.stage[data-scene="rest"] .pose{animation-duration:5.2s}
.ambience{position:absolute;left:var(--fx-x,27%);top:var(--fx-y,42%);pointer-events:none;color:var(--fx-color,#ffde91)}
.ambience i{position:absolute;font:21px var(--pixel);opacity:0;animation:drift 4.5s ease-out infinite}
.ambience i:nth-child(2){left:13px;animation-delay:-1.6s}.ambience i:nth-child(3){left:-7px;animation-delay:-3.2s}
.stage[data-scene="club"]{--fx-x:28%;--fx-y:28%}
.stage[data-scene="desk"]{--fx-x:51%;--fx-y:55%;--fx-color:#ffe3a9}
.stage[data-scene="classroom"]{--fx-x:39%;--fx-y:51%;--fx-color:#fff8ca}
.stage[data-scene="meal"]{--fx-x:71%;--fx-y:76%;--fx-color:#fff4dc}
.stage[data-scene="rest"]{--fx-x:69%;--fx-y:53%;--fx-color:#c9d9ff}
.stage[data-scene="anime"]{--fx-x:60%;--fx-y:61%;--fx-color:#e4bdfb}
.stage[data-scene="rest"][data-pose="cross"] .ambience{visibility:hidden}
.stage[data-scene="club"] .ambience i{animation-name:twinkle}
.stage[data-scene="classroom"] .ambience i{width:13px;height:2px;background:linear-gradient(90deg,#ffa990,#fff4ab,#9ce0df,#c39aff);font-size:0;animation-name:refraction}
.stage[data-scene="meal"] .ambience i{width:8px;height:21px;border-left:2px solid #fff4dc;border-radius:50%;font-size:0;animation-name:steam}
.stage[data-scene="rest"] .ambience i{font-size:16px;animation-duration:5.5s}
.stage[data-scene="rest"] .ambience i:nth-child(2){font-size:21px}
.stage[data-scene="rest"] .ambience i:nth-child(3){font-size:13px}
.tap-fx{position:absolute;pointer-events:none;color:var(--fx-color,var(--gold))}
.ripple,.tap-fx b{position:absolute;left:0;top:0}
.ripple{width:23px;height:23px;margin:-12px;border:2px solid currentColor;box-shadow:0 0 0 1px #3a3248;animation:ripple .5s ease-out forwards}
.tap-fx b{font:19px var(--pixel);text-shadow:1px 2px #302d43;animation:scatter .55s ease-out forwards;--dx:20px;--dy:-25px}
.tap-fx b:nth-child(3){--dx:-22px;--dy:-18px}.tap-fx b:nth-child(4){--dx:11px;--dy:16px}
.prop{position:absolute;left:14px;bottom:14px;min-height:44px;display:flex;align-items:center;gap:7px;padding:3px 11px 3px 5px;color:var(--cream);background:#191b30ee;border:2px solid #bcb0bd;box-shadow:2px 2px #111321;font:17px var(--pixel)}
.prop:hover,.prop:focus-visible{border-color:var(--gold);color:var(--gold)}
.item-icon{width:31px;aspect-ratio:1;display:block;background-image:url("assets/live/items.webp");background-position:var(--item-tile);background-size:300% 200%;background-repeat:no-repeat;image-rendering:pixelated}
.item-view{position:absolute;pointer-events:none;left:14px;bottom:68px;display:grid;justify-items:center;padding:9px 12px 6px;background:#20223bea;color:var(--gold);border:2px solid #b3a4bd;box-shadow:3px 3px #111321;font:16px var(--pixel);animation:arrive .18s ease-out}
.item-view[hidden]{display:none}.item-view .item-icon{width:clamp(44px,7vw,92px)}
.stage[data-scene="desk"] .item-view{transform:rotate(-3deg);background:#fff2d6;color:#47354a;border-color:#dfceae}
.stage[data-scene="rest"] .item-view .item-icon{animation:clock-ring .45s ease-in-out 2}
.stage[data-scene="anime"] .item-view .item-icon{filter:drop-shadow(0 0 6px #a697ec)}
.stage[data-scene="club"] .item-view .item-icon{background-color:#1a203b;border-radius:50%;box-shadow:0 0 0 1px #7776a5}
.stage[data-scene="classroom"] .viewport:has(.item-view:not([hidden])) .room{filter:saturate(1.12)}
.stage[data-scene="classroom"] .viewport:has(.item-view:not([hidden])) .ambience i{width:clamp(30px,7vw,85px);height:3px}
.stage[data-scene="meal"] .viewport:has(.item-view:not([hidden])) .ambience i{height:32px;animation-duration:2.4s}
.screen-label{position:absolute;left:16px;top:16px;background:#131628eb;border:1px solid #7e7890;color:var(--cream);padding:2px 10px;font-size:16px}
.speech{position:absolute;top:20%;right:45%;max-width:45%;padding:9px 14px;color:#30283c;background:#fff3d7;border:2px solid #35283e;box-shadow:3px 3px #35283e;font:18px/1.55 var(--pixel)}
.speech:after{content:"";position:absolute;right:-10px;bottom:8px;border:5px solid transparent;border-left-color:#fff3d7}
.dialogue{min-height:100px;display:grid;grid-template-columns:74px 1fr 44px;gap:17px;align-items:center;border-top:2px solid #85819b;padding:13px 22px;background:#24263c}
.portrait{width:68px;height:68px;flex:none;background:#414058 url("assets/portraits.webp") 0 50%/300% 100% no-repeat;border-bottom:2px solid var(--gold);image-rendering:pixelated}
.stage .portrait{background-image:url("assets/live/faces.webp");background-size:400% 600%;background-position:var(--face-x,0%) var(--face-y,0%)}
.stage[data-scene="desk"]{--face-y:20%}.stage[data-scene="classroom"]{--face-y:40%}
.stage[data-scene="meal"]{--face-y:60%}.stage[data-scene="rest"]{--face-y:80%}.stage[data-scene="anime"]{--face-y:100%}
.stage[data-pose="startled"]{--face-x:33.33333%}.stage[data-pose="sharing"]{--face-x:66.66667%}.stage[data-pose="cross"]{--face-x:100%}
.speaker{font-size:18px;color:var(--gold)}
.dialogue p{margin:0;font:18px/1.65 var(--pixel)}
.dialogue-copy{container:dialogue-text / inline-size;font-size:18px}
@container dialogue-text (max-width:27em){.dialogue p{min-block-size:2lh}}
@container dialogue-text (max-width:14em){.dialogue p{min-block-size:3lh}}
.advance{border:0;background:#39394d;color:var(--gold);width:44px;height:44px;font-size:17px}
.field-stage .portrait{background-image:url("assets/live/field-faces.webp");background-size:400% 400%}
.field-stage .item-icon{background-image:url("assets/live/field-items.webp");background-size:200% 200%}
.stage[data-scene="campus"]{--fx-x:37%;--fx-y:29%;--fx-color:#f3ce70}
.stage[data-scene="campus"] .ambience i{animation-name:fall-leaf}
.stage[data-scene="tea"]{--fx-x:33%;--fx-y:68%;--fx-color:#f4cc9d}
.stage[data-scene="game"]{--fx-x:27%;--fx-y:43%;--fx-color:#8de4ca}
.stage[data-scene="game"] .ambience i{font-size:10px;animation:twinkle 2.7s steps(4) infinite}
.stage[data-scene="library"]{--fx-x:36%;--fx-y:42%;--fx-color:#f7deb2}
@keyframes fall-leaf{0%{opacity:0;transform:translate(-12px,-20px) rotate(-22deg)}30%{opacity:.85}100%{opacity:0;transform:translate(21px,30px) rotate(65deg)}}
.filters,.gallery-list{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px}
.gallery .pagehead{margin-bottom:22px}
.gallery-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,22%);gap:24px;align-items:start}
.gallery-index h2{font-size:21px;margin:0 0 10px}
.scene-select{display:none}
.gallery-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gallery-list a{display:block;border:2px solid var(--line);color:var(--muted);text-decoration:none;font:18px/1.5 var(--pixel);background:var(--panel)}
.gallery-list a[aria-current],.gallery-list a:hover{border-color:var(--gold);color:var(--cream)}
.gallery-list img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;object-position:50% 36%}
.gallery-list span{display:block;padding:4px 6px;font-size:16px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:22px}
.sheet,.paper{position:relative;display:block;color:#352c2e;background:#f2e6c9;border:2px solid #c5ae85;box-shadow:4px 4px #090b18}
.sheet{padding:20px 22px;text-decoration:none;transition:transform .15s}
.sheet:hover{transform:translateY(-3px)}
.paper-meta{display:flex;align-items:center;gap:12px;color:#715a48;font-size:19px}
.paper-meta b{font-size:14px;font-weight:normal;border:1px solid #8d755a;padding:0 5px}
.sheet p,.paper p{font:1.0625rem/1.75 var(--body);overflow-wrap:anywhere}
.sheet p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;margin:12px 0}
.read{display:block;color:#68513b}
.reader .paper{margin:20px 0;padding:clamp(22px,6vw,68px)}
.paper h1{color:#423342;font-size:clamp(30px,5vw,52px);margin:20px 0}
.paper p{font-size:1.125rem;line-height:1.85;white-space:pre-line}
.signature{text-align:right;color:#705c48;font:23px var(--pixel)}
.trail{display:grid;grid-template-columns:100px 1fr;gap:22px;padding-block:18px;border-bottom:1px solid var(--line)}
.trail time,.ruled small,.note small{color:var(--mint);font:16px var(--pixel)}
.trail time small{display:block;color:var(--muted);margin-top:6px}
.trail h3{font-size:21px;margin:0}
.trail p,.note p{margin:8px 0 0;color:#d3cddd}
.home-columns .trail{padding-top:8px}
.home-columns .trail p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ruled{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:12px 0}
.ruled small{white-space:nowrap}
.ruled small:is([data-status=open],[data-status=reviewing]),.note small.pending{color:var(--gold)}
.ruled small:is([data-status=parked],[data-status=dropped]){color:var(--muted)}
.more a{font:17px var(--pixel);text-decoration:none}.more a:hover{text-decoration:underline}
.routine-row{display:grid;grid-template-columns:138px minmax(0,1fr) auto;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.routine-row time{color:var(--mint);font:18px var(--pixel);font-variant-numeric:tabular-nums}
.routine-row span{color:var(--cream)}.routine-row small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.routine-row b{color:var(--muted);font:15px var(--pixel);border:1px solid var(--line);padding:1px 8px}
.note{border-left:3px solid var(--gold);padding:6px 20px;margin:18px 0 25px}
.note h3{margin-top:4px}
.legend{display:flex;align-items:center;gap:8px;font-size:15px}
.legend i,.bars i{background:var(--gold)}.legend i:last-of-type,.bars i+i{background:#ad9ad9}
.legend i{width:9px;height:9px;display:inline-block}
.plot{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;border-block:1px solid var(--line);padding-top:20px;background:repeating-linear-gradient(to top,transparent 0 49px,#34364a 50px)}
.plot-day{border:0;background:transparent;color:var(--muted);padding:0 2px 8px;font:16px var(--pixel)}
.plot-day[aria-pressed=true],.plot-day:hover{color:var(--gold);background:#ffffff0d}
.bars{height:150px;display:flex;justify-content:center;align-items:flex-end;gap:3px;margin-bottom:8px}
.bars i{display:block;width:24%;max-width:34px}
.stats-page{max-width:990px}
.stats-head{display:flex;align-items:end;justify-content:space-between;gap:15px}
.stats-head h1{margin-bottom:0}
.stats-dates{font:20px var(--pixel);color:var(--gold);text-align:right}
.stats-dates small,.stats-archive>p{display:block;color:var(--muted);font:14px/1.6 var(--body);margin-top:5px}
.stat-readout{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0 30px;border-block:1px solid var(--line);padding:18px 0}
.stat-readout>div{padding-left:18px;border-left:1px solid var(--line)}
.stat-readout>div:first-child{padding-left:0;border:0}
.stat-readout dt,.stat-readout dd{font-family:var(--pixel);margin:0}
.stat-readout dt{color:var(--muted);font-size:16px}
.stat-readout dd{color:var(--cream);font-size:clamp(35px,4.2vw,56px);line-height:1.15}
.stat-readout small{font-size:16px;color:var(--gold);padding-left:6px}
.stats-page h2{font-size:clamp(25px,3vw,32px)}
.stats-chart .section-title{margin-bottom:12px}
.stats-chart .plot{padding-top:7px;background:transparent;gap:0}
.stats-chart .bars{position:relative;height:132px;padding-top:25px;margin-bottom:7px;background:repeating-linear-gradient(to top,#34364a 0 1px,transparent 1px 32px)}
.bars small{position:absolute;top:1px;left:0;right:0;color:var(--cream);font:15px var(--pixel)}
.bars small b{font-weight:normal;color:var(--gold)}.bars small b+b{color:#cbb8ea}
.gap-mark{color:var(--muted);margin-bottom:6px}
.plot-caption{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.sum-week,.profile-topics button,.scene-select select{background:var(--panel);color:var(--cream);border:1px solid var(--line);font:17px var(--pixel);padding:7px 12px;min-height:40px}
.sum-week[aria-pressed=true],.profile-topics [aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:clamp(25px,7vw,90px)}
.breakdown h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:21px}
.breakdown h3 small{color:var(--mint);font:16px var(--pixel)}
.meter-row,.count-row{display:grid;align-items:center;gap:14px;border-bottom:1px solid #34364a;min-height:35px;font-size:15px}
.meter-row{grid-template-columns:5em 1fr 2em}.count-row{grid-template-columns:1fr auto}
.meter-row b,.count-row b{font:18px var(--pixel);color:var(--cream);text-align:right}
.count-row small{font-size:15px;color:var(--muted)}
.meter{height:6px;background:#30314a}.meter i{height:100%;display:block;background:var(--mint)}
.stats-blank{padding:15px 18px;background:var(--panel)}
.stats-detail,.stats-archive{margin-top:30px}
.stats-archive h2{margin-bottom:3px}
.shelf-links a{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.shelf-links strong,.profile-note a{font:19px var(--pixel)}.shelf-links span{font-size:14px;color:var(--muted)}.shelf-links i{font-style:normal}
.profile-topics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.profile-note{display:grid;grid-template-columns:minmax(0,42%) 1fr;gap:22px;align-items:center;border-block:1px solid var(--line);padding:15px 0}
.profile-note img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:65% center}
.profile-note h3{font-size:16px;color:var(--mint);margin:0}
.profile-note blockquote{color:var(--cream);font:23px/1.5 var(--pixel);margin:5px 0}
.profile-note p{margin:8px 0;font-size:15px}
.profile{display:flex;align-items:center;gap:22px}
.profile h2,.profile p{margin:0}
.error,.empty,.loading:empty{padding-block:20px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer>.wrap{display:flex;align-items:center;flex-wrap:wrap;gap:18px;min-height:74px;padding-block:14px}
footer .brand{font-size:18px}footer .star{width:14px;height:14px}footer a{margin-left:auto}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{50%{transform:scale(1.003,1.012) rotate(.18deg)}}
@keyframes drift{0%{opacity:0;transform:translate(0,0) scale(.75)}22%{opacity:.9}100%{opacity:0;transform:translate(12px,-39px) scale(1.14)}}
@keyframes twinkle{0%,65%,100%{opacity:0;transform:scale(.4)}34%{opacity:.9;transform:scale(1.12)}}
@keyframes refraction{0%,100%{opacity:0;transform:rotate(-19deg) scaleX(.4)}48%{opacity:.85;transform:translateX(5px) rotate(-19deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(5px) rotate(12deg)}27%{opacity:.72}100%{opacity:0;transform:translate(7px,-31px) rotate(-17deg)}}
@keyframes clock-ring{20%,60%{transform:rotate(-6deg)}40%,80%{transform:rotate(6deg)}}
@keyframes ripple{to{transform:rotate(45deg) scale(2);opacity:0}}
@keyframes scatter{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media(min-width:721px){
 .gallery{padding-top:24px}.gallery h1{font-size:42px}
 .gallery .pagehead{padding-bottom:10px;margin-bottom:14px}
 .live{max-width:clamp(720px,calc((100svh - 250px)*1.97),1120px);padding-top:24px}
 .live h1{font-size:42px}.live .section-title{margin-bottom:14px}
 .live .dialogue{min-height:78px;padding-block:8px}
}
@media(max-width:970px){
 .wrap{width:calc(100% - 48px)}.bar{gap:14px}.brand{font-size:21px}nav{gap:1px}nav a{font-size:16px;padding:9px}
 .home-columns{gap:24px}.trail{grid-template-columns:82px 1fr;gap:13px}
}
@media(max-width:720px){
 .wrap{width:calc(100% - 32px)}.bar{display:block;padding-top:12px}.brand{gap:9px}.star{width:20px;height:20px}
 nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px 0}nav a{text-align:center;padding:9px 1px;font-size:15px}
 .hero{height:auto;min-height:500px;align-content:end}.hero-art{height:70%;background-position:70% 27%}
 .hero:before{background:linear-gradient(0deg,#25213b 13%,rgba(37,33,59,.97) 35%,rgba(37,33,59,.62) 48%,transparent 77%)}
 .hero-content{padding:0 5px 30px}.hero h1{font-size:clamp(44px,8vw,56px);margin:12px 0 6px;line-height:1.12}.hero h1 br{display:none}
 .hero p{font-size:15px;line-height:1.65}.actions{margin-top:17px;gap:10px}.action{font-size:16px;padding:8px 12px}
 .transmission>.wrap{gap:10px;min-height:60px}.transmission a,.transmission b{font-size:15px}#now{font-size:14px}
 .inner,.home-log{padding-block:30px 40px}.home-columns{grid-template-columns:1fr}.section-title{gap:8px}.section-title>a{font-size:15px}
 .gallery-layout{display:block}.gallery-index{display:none}
 .scene-select{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:var(--muted);font:16px var(--pixel)}
 .scene-select select{flex:1;min-width:0;min-height:44px}
 .stats-head{align-items:start;flex-direction:column}.stats-dates{text-align:left;font-size:17px}
 .stat-readout{grid-template-columns:1fr 1fr;row-gap:12px;padding:12px 0}.stat-readout>div:nth-child(3){padding-left:0;border:0}
 .breakdown{grid-template-columns:1fr;gap:24px}.breakdown h3{font-size:19px}
 .bars small{font-size:12px}.plot-caption{font-size:12px}.sum-week{min-height:44px;white-space:nowrap}
 .shelf-links a{grid-template-columns:auto 1fr auto}.shelf-links strong{font-size:17px}
 .profile-note{grid-template-columns:1fr;gap:12px}.profile-note img{aspect-ratio:2.1}
 .profile-topics{display:grid;grid-template-columns:repeat(3,1fr)}.profile-topics button{min-height:44px}
 .dialogue{grid-template-columns:44px 1fr 44px;gap:9px;padding:10px}.portrait{width:44px;height:44px}.dialogue p,.dialogue-copy{font-size:16px}
 .screen-label{top:7px;left:7px;font-size:13px}.screen,.opening-screen{aspect-ratio:16/10}
 .speech{top:27%;font-size:14px;line-height:1.4;padding:6px 8px}
 .prop{left:7px;bottom:7px;font-size:14px;min-height:44px}.prop .item-icon{width:24px}
 .item-view{left:7px;bottom:57px;padding:4px;font-size:12px}.actor{right:0}
 .viewport:has(.item-view:not([hidden])) .speech{display:none}
 .live-meta{align-items:flex-start;flex-direction:column;gap:1px;font-size:15px}.eyebrow{font-size:13px}
 .plot-day{font-size:14px}.legend{gap:4px;font-size:13px}.day-info{font-size:16px}
 .routine-row{grid-template-columns:104px minmax(0,1fr) auto;gap:10px}.routine-row time{font-size:15px}.routine-row b{font-size:13px;padding:0 5px}
 footer>.wrap{gap:10px}footer a{margin-left:0}.profile{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.travel-book{max-width:1060px}
.travel-stop{display:grid;grid-template-columns:108px minmax(0,1fr);gap:24px}
.travel-stop time{padding-top:4px;color:var(--mint);font:18px/1.4 var(--pixel);font-variant-numeric:tabular-nums}
.travel-place{position:relative;min-width:0;border-left:2px solid #494b61;padding:0 0 44px 32px}
.travel-place::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;background:var(--gold);box-shadow:0 0 0 4px var(--night)}
.travel-stop:last-child .travel-place{padding-bottom:8px}
.travel-place header{display:flex;gap:15px;align-items:baseline;margin-bottom:14px}
.travel-place header span{color:var(--muted);font:18px var(--pixel)}
.travel-place h2{margin:0;font-size:32px}
.postcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.postcard{min-width:0;margin:0;background:#f3e9cd;border:1px solid #ad9670;padding:9px;box-shadow:4px 4px #0a0b15}
.postcard-open{position:relative;display:block;width:100%;padding:0;border:0;background:#26243b;cursor:zoom-in}
.postcard-open img{display:block;width:100%;height:auto}
.postcard-open span{position:absolute;right:8px;bottom:8px;background:#191a2bde;color:var(--cream);padding:4px 9px;font:15px/1.35 var(--pixel)}
.postcard figcaption{color:#393347;font:16px/1.8 var(--body);padding:12px 9px 5px}
.travel-more{margin:0 0 14px}
.travel-viewer{width:fit-content;max-width:96vw;max-height:95vh;overflow:auto;margin:auto;padding:10px;background:var(--night);color:var(--cream);border:1px solid var(--line)}
.travel-viewer::backdrop{background:#080913e8}
.travel-viewer form{text-align:right;margin:0 0 8px}
.travel-viewer button{color:var(--cream);font:17px var(--pixel);background:var(--panel);border:1px solid var(--line);padding:8px 14px;cursor:pointer}
.travel-viewer img{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;margin:auto}
.travel-viewer p{max-width:65ch;margin:10px auto 3px}
@media(min-width:721px) and (max-width:850px){.bar{flex-wrap:wrap;justify-content:center;padding-block:9px}}
@media(max-width:720px){
 .travel-stop{display:block;position:relative;padding-left:16px;border-left:2px solid #494b61}
 .travel-stop time{display:block;font-size:15px;padding:0 0 4px}
 .travel-place{position:static;padding:0 0 30px;border:0}
 .travel-place::before{top:6px}
 .travel-place h2{font-size:27px}
 .postcards{grid-template-columns:1fr}
 .postcard{padding:6px}.postcard figcaption{padding:9px 6px 5px;font-size:15px}
}
