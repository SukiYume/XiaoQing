[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoqing"
version = "4.2.0"
description = "基于 OneBot 协议和 Python asyncio 的轻量级 QQ 机器人框架，内置向量记忆与行为规划"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "XiaoQing Team"}
]
keywords = ["qqbot", "onebot", "async", "plugin", "chatbot", "ai", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
]

# 核心依赖
dependencies = [
    "aiohttp>=3.8.0",
    "websockets>=11.0",
    # 3.x 私有 drain 能力经 scheduler_compat 行为探测隔离；不满足时使用公开关闭路径。
    "apscheduler>=3.11,<4",
    "pydantic>=2.5.0",
    "tomli>=2.0.1; python_version < '3.11'",
    # Pendo Web is enabled by default, so its server dependencies are core.
    "fastapi>=0.110.0",
    "starlette>=0.36.3",
    "uvicorn>=0.29.0",
    "PyJWT>=2.8.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
# 插件常用依赖
plugins = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "python-dateutil>=2.8.2",
]

# 机器学习相关插件（如 arxiv_filter, xiaoqing_chat）
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pandas>=2.0.0",
    "feedparser>=6.0.0",
]

# 天文工具插件
astro = [
    "astropy>=5.0.0",
]

# SSH远程控制插件
ssh = [
    "paramiko>=3.0.0",
]

# 开发和测试依赖
dev = [
    "build==1.5.1",
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.3.0",
    "aioresponses>=0.7.4",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pip-audit>=2.9.0",
    "pip-licenses>=5.0.0",
    "uv==0.11.28",
]

# Explicit feature extras. `web` repeats the default-on dependencies so
# `pip install xiaoqing[web]` remains a discoverable, stable install target.
web = [
    "fastapi>=0.110.0",
    "starlette>=0.36.3",
    "uvicorn>=0.29.0",
    "PyJWT>=2.8.0",
]

jupyter = [
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29.0",
]

arxiv-ml = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "urllib3>=1.26.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pandas>=2.0.0",
    "feedparser>=6.0.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "tqdm>=4.66.0",
]

# 完整运行时安装（不包含测试、审计、格式化等开发工具）
all = [
    "xiaoqing[plugins,ml,web,jupyter,arxiv-ml,astro,ssh]",
]

[project.urls]
Homepage = "https://github.com/SukiYume/XiaoQing"
Documentation = "https://github.com/SukiYume/XiaoQing#readme"
Repository = "https://github.com/SukiYume/XiaoQing.git"
Issues = "https://github.com/SukiYume/XiaoQing/issues"

[project.scripts]
xiaoqing = "main:cli"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true
packages = [
    "core",
    "plugins",
    "plugins.adnmb",
    "plugins.ads_paper",
    "plugins.apod",
    "plugins.arxiv_filter",
    "plugins.arxiv_filter.inference",
    "plugins.astro_tools",
    "plugins.bot_core",
    "plugins.chat",
    "plugins.chime",
    "plugins.choice",
    "plugins.codex",
    "plugins.color",
    "plugins.dict",
    "plugins.earthquake",
    "plugins.echo",
    "plugins.github",
    "plugins.guess_number",
    "plugins.jupyter",
    "plugins.minecraft",
    "plugins.pendo",
    "plugins.pendo.commands",
    "plugins.pendo.core",
    "plugins.pendo.handlers",
    "plugins.pendo.models",
    "plugins.pendo.services",
    "plugins.pendo.utils",
    "plugins.pendo.web",
    "plugins.pendo.web.analytics",
    "plugins.pendo.web.api",
    "plugins.pendo.web.services",
    "plugins.qingpet",
    "plugins.qingpet.commands",
    "plugins.qingpet.models",
    "plugins.qingpet.services",
    "plugins.qingpet.utils",
    "plugins.qingssh",
    "plugins.shell",
    "plugins.signin",
    "plugins.smalltalk",
    "plugins.twitter",
    "plugins.url_parser",
    "plugins.voice",
    "plugins.wolframalpha",
    "plugins.xiaoqing_chat",
    "plugins.xiaoqing_chat.config",
    "plugins.xiaoqing_chat.expression",
    "plugins.xiaoqing_chat.llm",
    "plugins.xiaoqing_chat.media",
    "plugins.xiaoqing_chat.memory",
    "plugins.xiaoqing_chat.planning",
    "plugins.xiaoqing_chat.utils",
]

[tool.setuptools.package-data]
"*" = ["plugin.json"]
"plugins.arxiv_filter" = ["config.json"]
"plugins.color" = ["color.json", "stellar_colors.txt"]
"plugins.dict" = ["assets/*.txt", "assets/manifest.json"]
"plugins.pendo.web" = [
    "scriptable/*.js",
    "static/*.html",
    "static/*.svg",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/*/*.js",
]
"plugins.pendo.web.services" = ["assets/*.zip"]
"plugins.xiaoqing_chat.config" = ["xiaoqing_config.json"]
"plugins.xiaoqing_chat.media" = ["qq_face_builtin_catalog.json"]

# ============================================================
# 工具配置
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: 快速、无外部依赖的单元测试",
    "integration: 多组件协作测试",
    "plugin: 插件测试",
    "core: 核心模块测试",
    "slow: 慢速测试（>1 秒）",
    "async: 异步测试",
    "external: 需要外部依赖（已 mock 可运行）",
]

[tool.coverage.run]
branch = true
source = ["core", "plugins"]
omit = [
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
    "*/venv/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | __pycache__
    | \.venv
    | logs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C901",   # McCabe complexity
    "PIE790", # unnecessary pass after a docstring
    "RUF009", # function call used directly as a dataclass default
    "RUF012", # mutable class attributes must be marked ClassVar
    "RUF059", # unpacked values that are never used
    "TRY203", # useless try/except that immediately re-raises
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "logs",
]

[tool.ruff.lint.mccabe]
# 超过该阈值的函数应按职责拆分，避免入口函数同时承担解析、授权和资源回收。
max-complexity = 30

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
# 默认检查全部生产代码；下面的逐文件排除清单是可量化的既有类型债务。
# 插件树仍在迁移期间使用 skip，避免一次性把动态插件导入债务伪装成绿灯；core
# 在下方 override 中恢复 normal，只有五个已登记的 core 债务模块继续显式 skip。
# 新增运行时代码会自动进入门禁，不能再因未手工加入小样本列表而漏检。
follow_imports = "skip"
files = [
    "core",
    "plugins",
]
exclude = [
    "^tests/",
    "^build/",
    "^core/bounded_http\\.py$",
    "^core/config\\.py$",
    "^core/dispatcher\\.py$",
    "^core/onebot\\.py$",
    "^core/server\\.py$",
    "^plugins/adnmb/main\\.py$",
    "^plugins/ads_paper/ai_commands\\.py$",
    "^plugins/ads_paper/main\\.py$",
    "^plugins/ads_paper/storage\\.py$",
    "^plugins/apod/main\\.py$",
    "^plugins/arxiv_filter/arxiv_inference\\.py$",
    "^plugins/arxiv_filter/inference/knn_backend\\.py$",
    "^plugins/arxiv_filter/inference/multi_interest_backend\\.py$",
    "^plugins/arxiv_filter/numerics\\.py$",
    "^plugins/chime/main\\.py$",
    "^plugins/github/main\\.py$",
    "^plugins/minecraft/log_monitor\\.py$",
    "^plugins/pendo/commands/scheduled\\.py$",
    "^plugins/pendo/core/runtime\\.py$",
    "^plugins/pendo/main\\.py$",
    "^plugins/pendo/services/ai_parser\\.py$",
    "^plugins/pendo/services/db\\.py$",
    "^plugins/pendo/web/analytics/diary_overview\\.py$",
    "^plugins/pendo/web/api/config_routes\\.py$",
    "^plugins/pendo/web/api/events\\.py$",
    "^plugins/pendo/web/api/transfer\\.py$",
    "^plugins/wolframalpha/main\\.py$",
    "^plugins/xiaoqing_chat/brain_chat\\.py$",
    "^plugins/xiaoqing_chat/config/config\\.py$",
    "^plugins/xiaoqing_chat/handlers_helper\\.py$",
    "^plugins/xiaoqing_chat/handlers_internal\\.py$",
    "^plugins/xiaoqing_chat/handlers\\.py$",
    "^plugins/xiaoqing_chat/llm/llm_client\\.py$",
    "^plugins/xiaoqing_chat/logging_utils\\.py$",
    "^plugins/xiaoqing_chat/main\\.py$",
    "^plugins/xiaoqing_chat/media_registry\\.py$",
    "^plugins/xiaoqing_chat/media/emoji_library\\.py$",
    "^plugins/xiaoqing_chat/media/event_media_analysis\\.py$",
    "^plugins/xiaoqing_chat/media/event_media_common\\.py$",
    "^plugins/xiaoqing_chat/media/event_media\\.py$",
    "^plugins/xiaoqing_chat/memory/knowledge_extract\\.py$",
    "^plugins/xiaoqing_chat/memory/vector_store\\.py$",
    "^plugins/xiaoqing_chat/planning/pfc_engine\\.py$",
    "^plugins/xiaoqing_chat/reply_generator\\.py$",
    "^plugins/xiaoqing_chat/smalltalk_execution\\.py$",
]

[[tool.mypy.overrides]]
module = ["core", "core.*"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "core.bounded_http",
    "core.config",
    "core.dispatcher",
    "core.onebot",
    "core.server",
]
follow_imports = "skip"
